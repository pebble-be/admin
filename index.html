<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pebble · Admin</title>
<style>
*{box-sizing:border-box;margin:0}body{background:#100d06;color:#fff6d6;font:14px/1.45 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:#ffc400}
.ad{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:#17130a;border-right:1px solid #2c2512;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside .lg{font-size:22px;font-weight:800;padding:6px 12px 2px;color:#ffc400}aside small{color:#a89f78;padding:0 12px 14px}aside .t{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;color:#d9cf9f;text-align:left}aside .t.on{background:linear-gradient(135deg,#ffd43b,#ff9d00);color:#201a08;font-weight:700}aside .t:hover:not(.on){background:#241e0e}
main{padding:26px;overflow:auto;min-width:0}h1{font-size:24px;margin-bottom:16px}.mut{color:#a89f78;font-size:13px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.bar h1{margin:0;flex:1}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.c{background:#1b170c;border:1px solid #2c2512;border-radius:18px;padding:16px}.c .n{font-size:32px;font-weight:800;color:#ffc400}.c h3{font-size:14px;color:#a89f78;margin-bottom:8px;font-weight:600}
input,select,textarea{background:#1b170c;border:1px solid #2c2512;border-radius:12px;padding:9px 12px;outline:none}input:focus,textarea:focus{border-color:#ffc400}
.b{background:#2c2512;border-radius:10px;padding:7px 12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}.b:hover{background:#3a3117}.b.y{background:linear-gradient(135deg,#ffd43b,#ff9d00);color:#201a08}.b.r{background:#4a1d1d;color:#ff8a8a}.b .ic{width:16px;height:16px}
.tw{overflow-x:auto;background:#1b170c;border:1px solid #2c2512;border-radius:18px}table{width:100%;border-collapse:collapse;min-width:760px}th{color:#a89f78;text-align:left;font-weight:600;padding:12px}td{padding:10px 12px;border-top:1px solid #2c2512;vertical-align:middle}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#2c2512}.pill.r{background:#4a1d1d;color:#ff8a8a}.pill.g{background:#173a22;color:#7ee2a0}.pill.y{background:#4a3a08;color:#ffd24d}
.row{display:flex;align-items:center;gap:10px}.acts{display:flex;gap:6px;flex-wrap:wrap}.av{border-radius:50%}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.pg .c{padding:0;overflow:hidden}.pg img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.pg .i{padding:12px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media(max-width:820px){.ad{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}aside small,aside .lg{display:none}aside .t{white-space:nowrap}main{padding:16px}}
.spin{display:inline-block;width:14px;height:14px;border:2.5px solid rgba(0,0,0,.25);border-top-color:#201a08;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}@keyframes rot{to{transform:rotate(360deg)}}.b:disabled{opacity:.8;cursor:progress}
</style></head><body><div id="root"></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="fb.js"></script><script src="app.js"></script>
<script>
document.body.insertAdjacentHTML('beforeend','');
const root=$('#root'),docs=s=>s.docs.map(d=>({id:d.id,...d.data()})),fd=t=>t?.toDate?t.toDate().toLocaleDateString('fr-FR'):'—',ld='<p class=mut>Chargement…</p>';
const cnt=async q=>{try{return(await q.count().get()).data().count}catch(e){return(await q.get()).size}};
const log=(a,t)=>db.collection('auditLogs').add({by:ME.username,action:a,target:t,t:TS()});
const days=n=>[...Array(n)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(n-1-i));return d});
const bucket=(L,f,n=14)=>{const D=days(n),c=D.map(()=>0);L.forEach(x=>{const t=x[f]?.toDate?.();if(!t)return;const i=D.findIndex(d=>t>=d&&t<new Date(+d+864e5));if(i>=0)c[i]++});return{D,c}};
const bars=(b,col)=>{const m=Math.max(1,...b.c),w=100/b.c.length;return`<svg viewBox="0 0 100 40" preserveAspectRatio="none" style="width:100%;height:130px">${b.c.map((v,i)=>`<rect x=${i*w+.8} y=${40-v/m*36} width=${w-1.6} height=${v/m*36+.3} rx=1 fill=${col}><title>${b.D[i].toLocaleDateString('fr-FR')} : ${v}</title></rect>`).join('')}</svg><div class=mut style="display:flex;justify-content:space-between"><span>${b.D[0].toLocaleDateString('fr-FR')}</span><span>Aujourd'hui</span></div>`};
const TABS=[['dash','home','Tableau de bord'],['users','user','Utilisateurs'],['posts','photo','Publications'],['reports','flag','Signalements'],['news','send','Annonces'],['logs','sliders','Journal']];
const V={};let pg;
function go(t){document.querySelectorAll('aside .t').forEach(b=>b.classList.toggle('on',b.dataset.p==t));pg.innerHTML=ld;V[t]();location.hash=t}
function loginUI(msg=''){root.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class=c style="width:100%;max-width:400px;padding:26px"><div style="font-size:30px;font-weight:800;color:#ffc400">Pebble</div><p class=mut style="margin-bottom:16px">Espace administrateur</p><label class=mut>Email</label><input id=ae type=email value="Mouradaittaleb02@gmail.com" style="width:100%;margin:4px 0 12px"><label class=mut>Mot de passe</label><input id=ap type=password autofocus style="width:100%;margin:4px 0 12px"><div id=er style="color:#ff8a8a;min-height:20px;margin-bottom:8px">${esc(msg)}</div><button class="b y" id=ag style="width:100%;justify-content:center;padding:12px">Se connecter</button><p class=mut style="text-align:center;margin-top:14px"><a href=discover.html>Retour au site</a></p></div></div>`;
 const E={'auth/invalid-credential':'Email ou mot de passe incorrect','auth/invalid-email':'Email invalide','auth/too-many-requests':'Trop de tentatives, réessaie plus tard'};
 const go=()=>withLoad($('#ag'),'Connexion…',async()=>{$('#er').textContent='';try{await auth.signInWithEmailAndPassword($('#ae').value.trim(),$('#ap').value)}catch(x){$('#er').textContent=E[x.code]||x.message}});
 $('#ag').onclick=go;$('#ap').onkeydown=e=>{if(e.key=='Enter')go()}}
function denied(u){root.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class=c style="max-width:480px;padding:26px"><h1 style="margin-bottom:8px">Accès refusé</h1><p class=mut>Le compte <b style="color:#fff6d6">${esc(u.email)}</b> n'est pas encore administrateur.</p><p class=mut style="margin:12px 0 6px">Dans Firebase → Firestore → collection <b>admins</b> → crée un document dont l'ID est :</p><input readonly value="${u.uid}" onclick="this.select()" style="width:100%;font-family:monospace"><div class=row style="margin-top:14px"><button class=b id=dn1>Déconnexion</button><a class=b href=discover.html style="text-decoration:none">Retour au site</a></div></div></div>`;$('#dn1').onclick=()=>auth.signOut()}
auth.onAuthStateChanged(async u=>{if(!u)return loginUI();
 if(!u.emailVerified){await auth.signOut();return loginUI('Email pas encore vérifié : clique sur le lien reçu par mail.')}
 if(!(await db.doc('admins/'+u.uid).get()).exists)return denied(u);
 ME={uid:u.uid,...(await db.doc('users/'+u.uid).get()).data()};
 root.innerHTML=`<div class=ad><aside><div class=lg>Pebble</div><small>Admin · v1.3</small>${TABS.map(t=>`<button class=t data-p=${t[0]}>${ic(t[1])}${t[2]}</button>`).join('')}<span style=flex:1></span><a class=t href=discover.html style=text-decoration:none>${ic('back')}Retour au site</a><button class=t id=lo>${ic('out')}Déconnexion</button><small style=padding-top:8px>© 2026 Mourad Project</small></aside><main id=pg></main></div>`;
 pg=$('#pg');$('aside').onclick=e=>{const b=e.target.closest('[data-p]');if(b)go(b.dataset.p)};$('#lo').onclick=()=>auth.signOut();go(V[location.hash.slice(1)]?location.hash.slice(1):'dash')});

V.dash=async()=>{const[nu,np,nb,nc,U,P,R]=await Promise.all([cnt(db.collection('users')),cnt(db.collection('posts')),cnt(db.collection('users').where('banned','==',true)),cnt(db.collection('chats')),db.collection('users').orderBy('created','desc').limit(400).get(),db.collection('posts').orderBy('t','desc').limit(400).get(),db.collection('reports').limit(300).get()]);
 const u=docs(U),p=docs(P),pend=docs(R).filter(r=>r.status!='done').length,top=[...p].sort((a,b)=>(b.likes||[]).length-(a.likes||[]).length).slice(0,5);
 pg.innerHTML=`<h1>Tableau de bord</h1><div class=g><div class=c><h3>Utilisateurs</h3><div class=n>${nu}</div></div><div class=c><h3>Publications</h3><div class=n>${np}</div></div><div class=c><h3>Discussions</h3><div class=n>${nc}</div></div><div class=c><h3>Signalements en attente</h3><div class=n style="color:${pend?'#ff8a8a':'#7ee2a0'}">${pend}</div></div><div class=c><h3>Comptes suspendus</h3><div class=n>${nb}</div></div></div>
 <div class="g g2"><div class=c><h3>Inscriptions · 14 derniers jours</h3>${bars(bucket(u,'created'),'#ffc400')}</div><div class=c><h3>Publications · 14 derniers jours</h3>${bars(bucket(p,'t'),'#ff9d00')}</div></div>
 <div class="g g2"><div class=c><h3>Nouveaux utilisateurs</h3>${u.slice(0,6).map(x=>`<div class=row style=margin:8px 0>${av(x,34)}<div style=flex:1><b>${esc(x.name)}</b> <span class=mut>@${esc(x.username)}</span></div><span class=mut>${fd(x.created)}</span></div>`).join('')||'<p class=mut>Aucun</p>'}</div>
 <div class=c><h3>Publications les plus aimées</h3>${top.map(x=>`<div class=row style=margin:8px 0><img src="${x.img}" style="width:38px;height:38px;border-radius:8px;object-fit:cover"><div style=flex:1><b>@${esc(x.username)}</b> <span class=mut>${esc((x.cap||'').slice(0,28))}</span></div><b>${(x.likes||[]).length}</b></div>`).join('')||'<p class=mut>Aucune</p>'}</div></div>`};

V.users=async()=>{const U=docs(await db.collection('users').orderBy('created','desc').limit(500).get());
 pg.innerHTML=`<div class=bar><h1>Utilisateurs <span class=mut>(${U.length})</span></h1><input id=q placeholder="Rechercher nom, @username, email"><select id=f><option value=all>Tous</option><option value=ban>Suspendus</option><option value=ver>Vérifiés</option></select><button class="b y" id=ex>Export CSV</button></div><div class=tw><table><thead><tr><th>Utilisateur</th><th>Email</th><th>Inscrit</th><th>Statut</th><th>Actions</th></tr></thead><tbody id=tb></tbody></table></div>`;
 const draw=()=>{const q=$('#q').value.toLowerCase().replace('@',''),f=$('#f').value,L=U.filter(x=>(x.name+x.username+x.email).toLowerCase().includes(q)&&(f=='all'||(f=='ban'?x.banned:x.verified)));
  $('#tb').innerHTML=L.map(x=>`<tr><td><div class=row>${av(x,38)}<div><b>${esc(x.name)}</b><div class=mut>@${esc(x.username)}</div></div></div></td><td>${esc(x.email)}</td><td>${fd(x.created)}</td><td>${x.banned?'<span class="pill r">Suspendu</span>':'<span class="pill g">Actif</span>'} ${x.verified?'<span class="pill y">Vérifié</span>':''}</td><td><div class=acts><a class=b href="profile.html?u=${esc(x.username)}" target=_blank>Voir</a><button class=b data-a=ver data-i=${x.id}>${x.verified?'Retirer ✓':'Vérifier'}</button><button class=b data-a=pw data-i=${x.id}>Reset mdp</button><button class="b ${x.banned?'':'r'}" data-a=ban data-i=${x.id}>${ic('ban')}${x.banned?'Réactiver':'Suspendre'}</button><button class="b r" data-a=del data-i=${x.id}>${ic('trash')}Contenu</button></div></td></tr>`).join('')||'<tr><td colspan=5 class=mut>Aucun résultat</td></tr>'};
 $('#q').oninput=draw;$('#f').onchange=draw;draw();
 $('#ex').onclick=()=>{const c='uid,nom,username,email,inscrit,suspendu,verifie\n'+U.map(x=>[x.id,x.name,x.username,x.email,fd(x.created),!!x.banned,!!x.verified].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download='pebble-users.csv';a.click()};
 $('#tb').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const x=U.find(u=>u.id==b.dataset.i),a=b.dataset.a;
  if(a=='ban'){if(x.id==ME.uid)return alert('Tu ne peux pas te suspendre toi-même.');if(!confirm((x.banned?'Réactiver ':'Suspendre ')+'@'+x.username+' ?'))return;await db.doc('users/'+x.id).update({banned:!x.banned});x.banned=!x.banned;log(x.banned?'Suspension':'Réactivation','@'+x.username)}
  if(a=='ver'){await db.doc('users/'+x.id).update({verified:!x.verified});x.verified=!x.verified;log(x.verified?'Vérification':'Retrait vérification','@'+x.username)}
  if(a=='pw'){try{await auth.sendPasswordResetEmail(x.email);alert('Email de réinitialisation envoyé à '+x.email);log('Reset mot de passe','@'+x.username)}catch(er){alert(er.message)}}
  if(a=='del'){if(!confirm('Supprimer TOUTES les publications de @'+x.username+' ?'))return;const q=await db.collection('posts').where('uid','==',x.id).get(),w=db.batch();q.forEach(d=>w.delete(d.ref));await w.commit();alert(q.size+' publication(s) supprimée(s)');log('Suppression contenu ('+q.size+')','@'+x.username)}
  draw()}};

V.posts=async()=>{const P=docs(await db.collection('posts').orderBy('t','desc').limit(120).get());
 pg.innerHTML=`<div class=bar><h1>Publications <span class=mut>(${P.length} récentes)</span></h1><input id=q placeholder="Filtrer par @username ou légende"></div><div class=pg id=gr></div>`;
 const draw=()=>{const q=$('#q').value.toLowerCase().replace('@','');$('#gr').innerHTML=P.filter(p=>((p.username||'')+(p.cap||'')).toLowerCase().includes(q)).map(p=>`<div class=c><img src="${p.img}"><div class=i><b>@${esc(p.username)}</b> <span class=mut>${fd(p.t)}</span><p class=mut style="margin:4px 0">${esc((p.cap||'').slice(0,80))}</p><div class=row><span class=pill>${(p.likes||[]).length} j'aime</span><span style=flex:1></span><button class="b r" data-d=${p.id}>${ic('trash')}Supprimer</button></div></div></div>`).join('')||'<p class=mut>Aucune publication.</p>'};
 $('#q').oninput=draw;draw();$('#gr').onclick=async e=>{const b=e.target.closest('[data-d]');if(!b||!confirm('Supprimer cette publication ?'))return;const p=P.find(x=>x.id==b.dataset.d);await db.doc('posts/'+p.id).delete();P.splice(P.indexOf(p),1);log('Suppression publication','@'+p.username);draw()}};

V.reports=async()=>{const R=docs(await db.collection('reports').orderBy('t','desc').limit(150).get()),us=await Promise.all([...new Set(R.flatMap(r=>[r.by,r.target]))].map(gu));
 const draw=()=>{pg.innerHTML=`<h1>Signalements <span class=mut>(${R.filter(r=>r.status!='done').length} en attente)</span></h1><div class=tw><table><thead><tr><th>Date</th><th>Signalé</th><th>Motif</th><th>Par</th><th>Statut</th><th>Actions</th></tr></thead><tbody>${R.map(r=>{const t=UC[r.target]||{},b=UC[r.by]||{};return`<tr><td>${fd(r.t)}</td><td><div class=row>${av(t,32)}<b>@${esc(t.username)}</b></div></td><td>${esc(r.reason)}</td><td>@${esc(b.username)}</td><td>${r.status=='done'?'<span class="pill g">Traité</span>':'<span class="pill y">En attente</span>'}</td><td><div class=acts><a class=b href="profile.html?u=${esc(t.username)}" target=_blank>Voir</a>${t.banned?'':`<button class="b r" data-a=ban data-i=${r.id}>${ic('ban')}Suspendre</button>`}${r.status=='done'?'':`<button class=b data-a=ok data-i=${r.id}>${ic('check')}Résolu</button>`}</div></td></tr>`}).join('')||'<tr><td colspan=6 class=mut>Aucun signalement 🎉</td></tr>'}</tbody></table></div>`;
  $('tbody').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const r=R.find(x=>x.id==b.dataset.i);
   if(b.dataset.a=='ban'){if(!confirm('Suspendre @'+UC[r.target].username+' ?'))return;await db.doc('users/'+r.target).update({banned:true});UC[r.target].banned=true;log('Suspension (signalement)','@'+UC[r.target].username)}
   await db.doc('reports/'+r.id).update({status:'done'});r.status='done';log('Signalement traité','@'+UC[r.target].username);draw()}};draw()};

V.news=async()=>{const n=(await db.doc('config/announcement').get()).data()||{};
 pg.innerHTML=`<h1>Annonces</h1><div class=c style=max-width:560px><h3>Bannière affichée à tous les utilisateurs</h3><textarea id=tx rows=3 style="width:100%" placeholder="Ex : Maintenance ce soir à 23h">${esc(n.text||'')}</textarea><div class=row style=margin-top:10px><label class=row><input type=checkbox id=on ${n.on?'checked':''}> Activée</label><span style=flex:1></span><button class="b y" id=sv>Publier</button></div><p class=mut id=ms style=margin-top:8px></p></div>`;
 $('#sv').onclick=async()=>{await db.doc('config/announcement').set({text:$('#tx').value.trim(),on:$('#on').checked,t:TS()});log('Annonce '+($('#on').checked?'activée':'désactivée'),$('#tx').value.slice(0,40));$('#ms').textContent='Enregistré ✓'}};

V.logs=async()=>{const L=docs(await db.collection('auditLogs').orderBy('t','desc').limit(150).get());
 pg.innerHTML=`<h1>Journal d'activité</h1><div class=tw><table><thead><tr><th>Date</th><th>Admin</th><th>Action</th><th>Cible</th></tr></thead><tbody>${L.map(l=>`<tr><td>${l.t?.toDate?l.t.toDate().toLocaleString('fr-FR'):'—'}</td><td>@${esc(l.by)}</td><td>${esc(l.action)}</td><td>${esc(l.target)}</td></tr>`).join('')||'<tr><td colspan=4 class=mut>Aucune action pour le moment</td></tr>'}</tbody></table></div>`};
</script></body></html>
